name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: Use your permanent signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using your permanent signing key: new builds can update the installed app"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret found. This build gets a random key and cannot update an installed app."
          fi
      - name: Version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Tell the build to sign with your key
        run: |
          cat > /tmp/signing.snippet <<'SNIP'
              signingConfigs {
                  debug {
                      storeFile file("${System.getenv('HOME')}/.android/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          SNIP
          sed -i '/^android {/r /tmp/signing.snippet' android/app/build.gradle
          grep -n -A8 "^android {" android/app/build.gradle | head -14
      - name: App name
        run: |
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#>COLD LOGIC<#>𝙲𝙾𝙻𝙳 𝙻𝙾𝙶𝙸𝙲<#g' $S
          cat $S
