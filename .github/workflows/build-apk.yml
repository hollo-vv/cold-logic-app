      - name: Permissions (reminders, boot, microphone for the visualizer)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
      - name: Tell Gradle to sign with your key
        run: |
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("$HOME/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -14 android/app/build.gradle
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --refresh-dependencies && exit 0
            echo "Attempt $i failed, retrying in 30s"
            sleep 30
          done
          exit 1
      - name: Show which key signed the APK
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E "SHA256|Alias"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256"
      - name: Give the APK a unique name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ColdLogic-build${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ColdLogic-build${{ github.run_number }}
          path: ColdLogic-build${{ github.run_number }}.apk
      - name: Publish the APK for in-app updates
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ColdLogic-build${{ github.run_number }}.apk ColdLogic.apk
          gh release delete latest-apk --cleanup-tag --yes --repo ${{ github.repository }} || true
          gh release create latest-apk ColdLogic.apk --repo ${{ github.repository }} --target ${{ github.sha }} --latest --title "Cold Logic build ${{ github.run_number }}" --notes "Latest APK. The app's Get update button downloads this file."
